info:
  name: Update User's Email and Password
  type: http
  seq: 17

http:
  method: PUT
  url: "{{baseUrl}}/api/users"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "email": "newEmail@example.com",
        "password": "67890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
