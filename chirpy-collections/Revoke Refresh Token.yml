info:
  name: Revoke Refresh Token
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/api/revoke"
  headers:
    - name: Authorization
      value: Bearer {{refreshToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
