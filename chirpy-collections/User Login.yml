info:
  name: User Login
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/login"
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "password": "123456"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refresh_token
        method: jsonq
      variable:
        name: refreshToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
